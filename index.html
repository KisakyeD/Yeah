<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINS1 VIP | High-Accuracy Analytics & BTTS Daily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { vip: { gold: '#f59e0b', darkGold: '#b45309' } }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pulse-live { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Drawer Backdrop -->
    <div id="drawerBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden"></div>

    <!-- Slide-out Navigation Drawer -->
    <aside id="drawerMenu" class="fixed top-0 left-0 bottom-0 w-72 bg-gray-900 border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-4">
        <div class="space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-gray-800">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center font-black text-gray-950 text-base shadow-lg shadow-amber-500/10">W1</div>
                    <span class="font-extrabold text-base text-white">WINS1 <span class="text-amber-400">VIP</span></span>
                </div>
                <button id="closeDrawerBtn" class="p-2 rounded-lg bg-gray-800 text-gray-400 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <nav class="space-y-2">
                <button onclick="switchCategory('accumulator')" id="navAccumulator" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-amber-500/10 text-amber-400 font-semibold text-xs border border-amber-500/20 transition">
                    <span>VIP 100+ Accumulator</span>
                    <span class="text-[10px] font-mono bg-amber-500/20 px-1.5 py-0.5 rounded">Active</span>
                </button>
                <button onclick="switchCategory('btts')" id="navBtts" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800 font-medium text-xs transition">
                    <span>BTTS Daily Picks</span>
                    <span class="text-[10px] font-mono bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">Daily</span>
                </button>
                <button onclick="openSettingsModal()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800 font-medium text-xs transition text-left">
                    <span>⚙️ Settings & Preferences</span>
                </button>
                <a href="https://one.exnessonelink.com/a/m3alh1ljmu?source=app" target="_blank" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800 font-medium text-xs transition">
                    <span>📈 Trade Exness Markets</span>
                </a>
            </nav>

            <!-- Calendar Jump Section in Drawer -->
            <div class="pt-4 border-t border-gray-800 space-y-2">
                <label class="text-[11px] text-gray-400 font-mono block">Jump to Calendar Date:</label>
                <input type="date" id="drawerCalendarInput" onchange="jumpToDate(this.value)" class="w-full bg-gray-800 border border-gray-700 text-gray-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-500">
            </div>
        </div>

        <div class="pt-4 border-t border-gray-800 text-center">
            <span class="text-[10px] text-gray-500 font-mono">High-Accuracy Analytics Engine</span>
        </div>
    </aside>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-gray-800">
                <h3 class="font-bold text-white text-sm">Application Settings</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-gray-400 block mb-1">Odds Format</label>
                    <select id="settingOddsFormat" class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl p-2.5">
                        <option value="decimal">Decimal (1.85)</option>
                        <option value="fractional">Fractional (4/5)</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 block mb-1">Auto-Refresh Interval</label>
                    <select id="settingRefreshInterval" class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl p-2.5">
                        <option value="30">30 Seconds</option>
                        <option value="60">60 Seconds</option>
                        <option value="0">Manual Only</option>
                    </select>
                </div>
            </div>
            <button onclick="saveSettings()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold py-2.5 rounded-xl text-xs transition">
                Save Preferences
            </button>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-gray-900/90 border-b border-gray-800 px-4 py-3 backdrop-blur-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button id="openDrawerBtn" class="p-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center font-black text-gray-950 text-lg">W1</div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-extrabold text-lg text-white">WINS1 <span class="text-amber-400">VIP</span></h1>
                        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-live"></span> <span id="headerCategoryBadge">VIP 100+ ODDS</span>
                        </span>
                    </div>
                </div>
            </div>
            <button id="themeToggleBtn" class="p-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:text-white">
                <span id="themeIcon">☀️</span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Date Ribbon (-30 to +30 Days) -->
        <div class="flex items-center justify-between bg-gray-900 border border-gray-800 rounded-xl p-1.5 no-scrollbar overflow-x-auto gap-2" id="dateRibbon"></div>

        <!-- Ticket Section -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-white text-base flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> <span id="sectionTitleDate">TODAY'S</span> <span id="sectionTitleCategory">VIP 100+ ACCUMULATOR</span>
                </h3>
                <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded font-mono font-bold" id="totalOddsBadge">
                    TOTAL ODDS: 0.00
                </span>
            </div>

            <div class="grid grid-cols-1 gap-3" id="matchFeedContainer"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 px-4 text-center mt-auto">
        <p class="text-xs text-gray-400">
            Sponsored by <a href="https://one.exnessonelink.com/a/m3alh1ljmu?source=app" target="_blank" class="text-amber-400 font-semibold underline">Exness Global Markets</a>
        </p>
    </footer>

    <script>
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerMenu = document.getElementById('drawerMenu');
        const drawerBackdrop = document.getElementById('drawerBackdrop');

        function toggleDrawer(open) {
            if (!drawerMenu || !drawerBackdrop) return;
            if (open) {
                drawerBackdrop.classList.remove('hidden');
                drawerMenu.classList.remove('-translate-x-full');
            } else {
                drawerMenu.classList.add('-translate-x-full');
                drawerBackdrop.classList.add('hidden');
            }
        }

        if (openDrawerBtn) openDrawerBtn.addEventListener('click', () => toggleDrawer(true));
        if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
        if (drawerBackdrop) drawerBackdrop.addEventListener('click', () => toggleDrawer(false));

        function openSettingsModal() {
            toggleDrawer(false);
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            closeSettingsModal();
            fetchMatchData(selectedDateObj, false);
        }

        function getYYYYMMDD(d) {
            return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        }

        let selectedDateObj = new Date();
        let currentCategory = 'accumulator'; // 'accumulator' or 'btts'
        let autoRefreshTimer = null;
        let countdownTimer = null;
        let secondsRemaining = 30;

        function switchCategory(cat) {
            currentCategory = cat;
            toggleDrawer(false);

            document.getElementById('navAccumulator').className = cat === 'accumulator' 
                ? "w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-amber-500/10 text-amber-400 font-semibold text-xs border border-amber-500/20 transition"
                : "w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800 font-medium text-xs transition";

            document.getElementById('navBtts').className = cat === 'btts' 
                ? "w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-amber-500/10 text-amber-400 font-semibold text-xs border border-amber-500/20 transition"
                : "w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800 font-medium text-xs transition";

            document.getElementById('headerCategoryBadge').textContent = cat === 'accumulator' ? "VIP 100+ ODDS" : "BTTS DAILY";
            document.getElementById('sectionTitleCategory').textContent = cat === 'accumulator' ? "VIP 100+ ACCUMULATOR" : "BTTS DAILY ACCUMULATOR";

            fetchMatchData(selectedDateObj, false);
        }

        function jumpToDate(dateStr) {
            if (!dateStr) return;
            const target = new Date(dateStr + 'T00:00:00');
            selectedDateObj = target;
            toggleDrawer(false);
            initRibbon();
            fetchMatchData(target, false);
        }

        function evaluatePick(homeName, awayName, seed, index, category) {
            const hashVal = (stringHash(homeName) + stringHash(awayName) + seed + index) % 100;

            if (category === 'btts') {
                return {
                    label: "BTTS: Yes",
                    odd: parseFloat((1.72 + (hashVal % 15) / 100).toFixed(2)),
                    confidence: `${86 + (hashVal % 10)}%`,
                    check: (h, a) => h > 0 && a > 0
                };
            } else {
                if (hashVal % 3 === 0) {
                    return { label: "Double Chance: 1X", odd: parseFloat((1.45 + (hashVal % 10) / 100).toFixed(2)), confidence: "94%", check: (h, a) => h >= a };
                } else if (hashVal % 3 === 1) {
                    return { label: "Over 1.5 Goals", odd: parseFloat((1.55 + (hashVal % 12) / 100).toFixed(2)), confidence: "91%", check: (h, a) => (h + a) > 1 };
                } else {
                    return { label: "BTTS: Yes (Safe)", odd: parseFloat((1.75 + (hashVal % 14) / 100).toFixed(2)), confidence: "88%", check: (h, a) => h > 0 && a > 0 };
                }
            }
        }

        function stringHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        }

        async function fetchMatchData(dateObj, isSilentRefresh = false) {
            selectedDateObj = dateObj;
            const container = document.getElementById('matchFeedContainer');
            
            if (container && !isSilentRefresh) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs font-mono">Loading ${currentCategory === 'btts' ? 'BTTS Daily' : 'VIP Accumulator'} for ${dateObj.toLocaleDateString()}...</div>`;
            }

            const yyyymmdd = getYYYYMMDD(dateObj);
            const seed = dateObj.getDate() + (dateObj.getMonth() + 1) * 41;
            const espnGlobalUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${yyyymmdd}`;

            let matchEntries = [];

            try {
                const res = await fetch(espnGlobalUrl);
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.events && json.events.length > 0) {
                        const rawEvents = json.events.slice(0, currentCategory === 'btts' ? 5 : 6);
                        matchEntries = rawEvents.map((ev, i) => {
                            const comp = ev.competitions?.[0];
                            const home = comp?.competitors?.find(c => c.homeAway === 'home')?.team?.displayName || "Home Team";
                            const away = comp?.competitors?.find(c => c.homeAway === 'away')?.team?.displayName || "Away Team";
                            
                            const league = ev.season?.slug 
                                ? ev.season.slug.toUpperCase().replace(/-/g, ' ') 
                                : (ev.league?.name || "GLOBAL LEAGUE").toUpperCase();

                            let rawHScore = comp?.competitors?.find(c => c.homeAway === 'home')?.score;
                            let rawAScore = comp?.competitors?.find(c => c.homeAway === 'away')?.score;

                            const state = ev.status?.type?.state;
                            let status = ev.status?.type?.detail || "FT";

                            if (state === "pre") {
                                status = "UPCOMING";
                                rawHScore = "-";
                                rawAScore = "-";
                            } else if (state === "in") {
                                status = `LIVE ${ev.status?.displayClock || ''}`;
                            } else {
                                status = "FT";
                            }

                            if (rawHScore === undefined || rawHScore === null || status === "UPCOMING") {
                                rawHScore = "-";
                                rawAScore = "-";
                            }

                            const numericH = rawHScore === "-" ? 0 : parseInt(rawHScore, 10);
                            const numericA = rawAScore === "-" ? 0 : parseInt(rawAScore, 10);
                            
                            const pickEval = evaluatePick(home, away, seed, i, currentCategory);
                            const isWon = status === "UPCOMING" ? true : pickEval.check(numericH, numericA);

                            return {
                                league, home, away,
                                homeScore: rawHScore,
                                awayScore: rawAScore,
                                status,
                                pick: pickEval.label,
                                odd: pickEval.odd,
                                confidence: pickEval.confidence,
                                isWon,
                                isUpcoming: status === "UPCOMING"
                            };
                        });
                    }
                }
            } catch (e) {
                console.error("Global Feed Error", e);
            }

            if (matchEntries.length === 0) {
                if (container) {
                    container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs font-mono">No fixtures found for ${dateObj.toLocaleDateString()}. Please select another date.</div>`;
                }
                const oddsBadge = document.getElementById('totalOddsBadge');
                if (oddsBadge) oddsBadge.textContent = `TOTAL ODDS: 0.00`;
                resetAutoRefreshCountdown();
                return;
            }

            renderFeed(matchEntries);
            resetAutoRefreshCountdown();
        }

        function renderFeed(matches) {
            const container = document.getElementById('matchFeedContainer');
            if (!container) return;
            container.innerHTML = '';
            
            let totalOdds = matches.reduce((acc, m) => acc * m.odd, 1.0);
            const format = document.getElementById('settingOddsFormat')?.value || 'decimal';

            matches.forEach(m => {
                let badge = "";
                if (m.isUpcoming || m.status.includes("UPCOMING")) {
                    badge = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-black px-2 py-0.5 rounded">UPCOMING</span>`;
                } else if (m.status.includes("LIVE")) {
                    badge = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-black px-2 py-0.5 rounded animate-pulse">LIVE</span>`;
                } else {
                    badge = m.isWon
                        ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-black px-2 py-0.5 rounded">WON</span>`
                        : `<span class="bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] font-black px-2 py-0.5 rounded">LOST</span>`;
                }

                const displayOdd = format === 'fractional' ? `${Math.round((m.odd - 1) * 10)}/10` : m.odd.toFixed(2);

                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 hover:border-amber-500/40 transition";
                card.innerHTML = `
                    <div class="space-y-1 w-full md:w-auto">
                        <div class="flex items-center space-x-2 text-xs text-gray-400">
                            <span class="text-amber-400 font-semibold">${m.league}</span>
                            <span>•</span>
                            <span class="${m.status.includes('LIVE') ? 'text-emerald-400 font-bold animate-pulse' : 'text-gray-400'}">${m.status}</span>
                        </div>
                        <div class="text-sm font-bold text-white flex items-center space-x-3">
                            <span>${m.home}</span>
                            <span class="bg-gray-800 text-amber-400 px-2.5 py-0.5 rounded font-mono text-xs border border-gray-700">
                                ${m.homeScore} - ${m.awayScore}
                            </span>
                            <span>${m.away}</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between w-full md:w-auto gap-4 border-t md:border-0 border-gray-800 pt-2 md:pt-0">
                        <div class="text-left md:text-right flex items-center space-x-2">
                            <div>
                                <div class="flex items-center gap-1.5 mb-0.5">
                                    <span class="text-[10px] text-gray-400 font-mono">VIP SELECTION</span>
                                    <span class="text-[9px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1 rounded">${m.confidence} Conf.</span>
                                </div>
                                <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/20">${m.pick}</span>
                            </div>
                            ${badge}
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-gray-400 block font-mono">ODDS</span>
                            <span class="text-sm font-extrabold text-white font-mono">${displayOdd}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const oddsBadge = document.getElementById('totalOddsBadge');
            if (oddsBadge) oddsBadge.textContent = `TOTAL ODDS: ${totalOdds.toFixed(2)}`;
        }

        function initAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            if (countdownTimer) clearInterval(countdownTimer);

            secondsRemaining = 30;
            
            countdownTimer = setInterval(() => {
                const intervalSetting = parseInt(document.getElementById('settingRefreshInterval')?.value || '30', 10);
                if (intervalSetting === 0) return;

                secondsRemaining--;
                if (secondsRemaining <= 0) {
                    secondsRemaining = intervalSetting;
                    fetchMatchData(selectedDateObj, true);
                }
            }, 1000);
        }

        function resetAutoRefreshCountdown() {
            secondsRemaining = parseInt(document.getElementById('settingRefreshInterval')?.value || '30', 10);
        }

        function manualRefresh() {
            fetchMatchData(selectedDateObj, false);
        }

        function initRibbon() {
            const ribbon = document.getElementById('dateRibbon');
            if (!ribbon) return;

            const today = new Date();
            let todayBtn = null;
            ribbon.innerHTML = '';

            for (let i = -30; i <= 30; i++) {
                const target = new Date(today);
                target.setDate(today.getDate() + i);
                const label = target.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                const btn = document.createElement('button');
                btn.className = i === 0 
                    ? "px-4 py-2 rounded-lg bg-amber-500 text-gray-950 font-bold text-xs whitespace-nowrap shadow-md shadow-amber-500/20" 
                    : "px-4 py-2 rounded-lg text-gray-400 hover:bg-gray-800 text-xs whitespace-nowrap transition";
                btn.textContent = i === 0 ? `Today (${label})` : label;

                if (i === 0) todayBtn = btn;

                btn.onclick = () => {
                    Array.from(ribbon.children).forEach(c => c.className = "px-4 py-2 rounded-lg text-gray-400 hover:bg-gray-800 text-xs whitespace-nowrap transition");
                    btn.className = "px-4 py-2 rounded-lg bg-amber-500 text-gray-950 font-bold text-xs whitespace-nowrap shadow-md shadow-amber-500/20";
                    document.getElementById('sectionTitleDate').textContent = i === 0 ? "TODAY'S" : label.toUpperCase();
                    fetchMatchData(target, false);
                };

                ribbon.appendChild(btn);
            }

            if (todayBtn) {
                setTimeout(() => todayBtn.scrollIntoView({ behavior: 'smooth', inline: 'center' }), 100);
            }
        }

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                document.getElementById('themeIcon').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initRibbon();
            fetchMatchData(new Date(), false);
            initAutoRefresh();
        });
    </script>
</body>
</html>
