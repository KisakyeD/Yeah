<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Live Intelligence Stream</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: #1f2937;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
        }

        body.light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.2);
            --border: #e2e8f0;
            --success: #059669;
            --success-glow: rgba(5, 150, 105, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 var(--success-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 var(--success-glow);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stream-box {
            background: rgba(0, 0, 0, 0.03);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 16px;
            min-height: 180px;
            max-height: 250px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        body.light-theme .stream-box {
            background: rgba(0, 0, 0, 0.01);
        }

        .stream-line {
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(4px);
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timestamp {
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .metric-display {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--accent);
        }

        .metric-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        footer {
            margin-top: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <div class="pulse-dot"></div>
                <h1>Invisible Neural Stream</h1>
            </div>
            <div class="controls">
                <button id="themeToggle">
                    <span id="themeIcon">☀️</span> Theme
                </button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Feed Card -->
            <div class="card" style="grid-column: span 2;">
                <div class="card-title">Live Autonomous Inference Stream</div>
                <div class="stream-box" id="inferenceStream">
                    <!-- Dynamic live entries injected here -->
                </div>
            </div>

            <!-- Metric Card 1 -->
            <div class="card">
                <div class="card-title">Token Velocity</div>
                <div class="metric-display" id="tokenVelocity">0.0</div>
                <div class="metric-sub">Processed tokens per second</div>
            </div>

            <!-- Metric Card 2 -->
            <div class="card">
                <div class="card-title">System Latency</div>
                <div class="metric-display" id="systemLatency">0 ms</div>
                <div class="metric-sub">Real-time roundtrip response time</div>
            </div>
        </div>

        <footer>
            Autonomous AI Interface Engine &bull; Sponsored via <a href="https://one.exnessonelink.com/a/m3alh1ljmu?source=app" target="_blank">Exness Partner Network</a>
        </footer>
    </div>

    <script>
        // Theme Toggle Setup
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            themeIcon.textContent = isLight ? '🌙' : '☀️';
        });

        // Completely Invisible AI Synthetic Logic Stream Generator
        const streamContainer = document.getElementById('inferenceStream');
        const tokenVelocityEl = document.getElementById('tokenVelocity');
        const systemLatencyEl = document.getElementById('systemLatency');

        const aiContexts = [
            "Parsing incoming multi-threaded data stream...",
            "Executing background vector embedding alignment...",
            "Optimizing weights across attention heads...",
            "Synthesizing latent space representation...",
            "Validating state consistency across distributed memory...",
            "Performing heuristic anomaly scan...",
            "Calibrating real-time predictive confidence scores...",
            "Synchronizing background worker threads..."
        ];

        const hexCodes = ["0x4F7A", "0x9B12", "0xE341", "0x11A0", "0xFF88", "0x3C99", "0x7D22", "0x88EE"];

        function getTimeString() {
            const now = new Date();
            return now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
        }

        function appendStreamLine(text, highlight = false) {
            const line = document.createElement('div');
            line.className = 'stream-line';
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'timestamp';
            timeSpan.textContent = `[${getTimeString()}]`;
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            if(highlight) {
                textSpan.style.color = 'var(--accent)';
                textSpan.style.fontWeight = '600';
            }

            line.appendChild(timeSpan);
            line.appendChild(textSpan);
            streamContainer.appendChild(line);

            // Keep only latest 30 items for performance
            if (streamContainer.children.length > 30) {
                streamContainer.removeChild(streamContainer.firstChild);
            }

            streamContainer.scrollTop = streamContainer.scrollHeight;
        }

        // Live Dynamic Loop
        setInterval(() => {
            // Randomly choose context or telemetry log
            if (Math.random() > 0.4) {
                const randomMsg = aiContexts[Math.floor(Math.random() * aiContexts.length)];
                appendStreamLine(randomMsg);
            } else {
                const code = hexCodes[Math.floor(Math.random() * hexCodes.length)];
                const confidence = (Math.random() * (99.9 - 95.0) + 95.0).toFixed(2);
                appendStreamLine(`Node State Check: ${code} | Confidence: ${confidence}%`, true);
            }

            // Update live metrics
            const velocity = (Math.random() * (45 - 28) + 28).toFixed(1);
            tokenVelocityEl.textContent = velocity + " t/s";

            const latency = Math.floor(Math.random() * (18 - 8) + 8);
            systemLatencyEl.textContent = latency + " ms";

        }, 850);
    </script>
</body>
</html>
