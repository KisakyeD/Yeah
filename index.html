<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daggh</title>
    <style>
        .balance {
            font-size: 24px;
            font-weight: bold;
            color: #00698f;
        }
        #withdraw-btn {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Daggh Website</h1>
    <p>Current Balance: <span class="balance">100,000,000 UGX</span></p>
    <button id="withdraw-btn">Withdraw via BTC</button>
    <script>
        document.getElementById('withdraw-btn').addEventListener('click', function() {
            var amount = prompt("Enter amount to withdraw (in BTC):");
            var btcAddress = prompt("Enter your BTC address:");
            fetch('/withdraw', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    amount: amount,
                    btcAddress: btcAddress,
                }),
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
